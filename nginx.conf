user    root;  ## Default: nobody
worker_processes  auto;  ## Default: 1

events {
    worker_connections  1024;
}

http {

    sendfile        on;
    keepalive_timeout  65;

    # Включаем сжатие для статических файлов
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;
    gzip_comp_level 5;
    gzip_vary on;

    server {
        listen       80;

        server_name  localhost;

        location /  {
            proxy_pass http://ui-template-service:8080/;
        }

        # Обработка статических файлов
        location /static/ {
            alias /path-microservice/resource/;
            gzip_static on;  # Используем предварительно сжатые файлы
            expires 30d;     # Кэширование на 30 дней
            add_header Cache-Control "public, no-transform";
        }
    }
}